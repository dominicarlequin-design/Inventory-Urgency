<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Inventory Urgency Checker</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .product { padding: 8px; margin: 4px 0; border-radius: 4px; }
    .urgent { background: #ffe0e0; }
    .ok { background: #e0ffe0; }
  </style>
</head>
<body>
  <h1>Inventory Check</h1>
  <button onclick="renderList()">Check Urgency</button>
  <ul id="product-list"></ul>

  <script>
    const products = [
      { name: "Whole Milk", quantity: 8, reorderThreshold: 15, expirationDate: "2026-07-25" },
      { name: "Greek Yogurt", quantity: 22, reorderThreshold: 10, expirationDate: "2026-08-15" },
      { name: "Cheddar Cheese", quantity: 5, reorderThreshold: 12, expirationDate: "2026-09-01" },
      { name: "Butter", quantity: 30, reorderThreshold: 10, expirationDate: "2026-07-23" },
      { name: "Heavy Cream", quantity: 18, reorderThreshold: 8, expirationDate: "2026-08-20" },
      { name: "String Cheese", quantity: 40, reorderThreshold: 15, expirationDate: "2026-09-10" },
      { name: "Cottage Cheese", quantity: 6, reorderThreshold: 10, expirationDate: "2026-07-24" },
      { name: "Sour Cream", quantity: 25, reorderThreshold: 12, expirationDate: "2026-08-30" },
      { name: "Almond Milk", quantity: 14, reorderThreshold: 10, expirationDate: "2026-10-01" },
      { name: "Mozzarella", quantity: 3, reorderThreshold: 12, expirationDate: "2026-09-15" }
    ];

    function checkUrgency(products) {
      const today = new Date();

      return products
        .map(product => {
          const expirationDate = new Date(product.expirationDate);
          const daysUntilExpiry = Math.ceil((expirationDate - today) / (1000 * 60 * 60 * 24));

          const lowStock = product.quantity <= product.reorderThreshold;
          const nearExpiry = daysUntilExpiry <= 14;

          return {
            ...product,
            urgent: lowStock || nearExpiry,
            flags: { lowStock, nearExpiry, daysUntilExpiry }
          };
        })
        .sort((a, b) => b.urgent - a.urgent);
    }

    function renderList() {
      const results = checkUrgency(products);
      const list = document.getElementById("product-list");

      list.innerHTML = results.map(p => `
        <li class="product ${p.urgent ? 'urgent' : 'ok'}">
          ${p.urgent ? '🔴' : '✅'} <strong>${p.name}</strong>
          — Qty: ${p.quantity}
          ${p.flags.lowStock ? '| ⚠️ Low Stock' : ''}
          ${p.flags.nearExpiry ? `| ⏰ Expires in ${p.flags.daysUntilExpiry}d` : ''}
        </li>
      `).join('');
    }
  </script>
</body>
</html>
