<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventory Urgency</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Inter', system-ui, sans-serif; color: #0f172a; background: #f8fafc; }
  a { color: #0f766e; }
  a:hover { color: #115e59; }
  .page { min-height: 100vh; padding: 48px 32px; }
  .container { max-width: 1100px; margin: 0 auto; }
  .title { font-family: 'Inter Tight', sans-serif; font-size: 32px; font-weight: 700; letter-spacing: -0.02em; margin: 0; }
  .subtitle { margin: 8px 0 0; font-size: 15px; color: #64748b; }
  .stats { display: flex; gap: 20px; margin: 28px 0 32px; flex-wrap: wrap; }
  .stat-card { flex: 1; min-width: 180px; background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 18px 20px; }
  .stat-label { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
  .stat-value { font-family: 'Inter Tight', sans-serif; font-size: 34px; font-weight: 700; margin-top: 4px; }
  .columns { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .col-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .col-title { font-family: 'Inter Tight', sans-serif; font-size: 18px; font-weight: 600; margin: 0; }
  .card-list { display: flex; flex-direction: column; gap: 12px; }
  .card { background: #fff; border-radius: 10px; padding: 16px 18px; transition: box-shadow 0.15s ease, transform 0.15s ease; }
  .card:hover { box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08); transform: translateY(-1px); }
  .card-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .card-name { font-weight: 600; font-size: 16px; }
  .card-qty { font-size: 13px; color: #64748b; }
  .card-meta { font-size: 13px; color: #94a3b8; margin-top: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chip { font-size: 12px; font-weight: 600; background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; border-radius: 999px; padding: 4px 10px; }
  .chip-ok { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
  .chip-expired { background: #fff7ed; color: #c2410c; border: 1px solid #fdba74; }
  .urgent-card { border: 1px solid #fecaca; border-left: 4px solid #dc2626; }
  .fine-card { border: 1px solid #bbf7d0; border-left: 4px solid #16a34a; }
  .expired-card { border: 1px solid #fdba74; border-left: 4px solid #c2410c; }
  #checkBtn { font-family: 'Inter Tight', sans-serif; font-size: 15px; font-weight: 600; color: #fff; background: #0f766e; border: none; border-radius: 8px; padding: 12px 22px; cursor: pointer; transition: background 0.15s ease; }
  #checkBtn:hover { background: #115e59; }
  #checkBtn:active { background: #0d5c54; }
  @media (max-width: 700px) {
    .columns { grid-template-columns: 1fr; }
    .page { padding: 32px 20px; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="container">
    <header>
      <h1 class="title">Inventory Urgency</h1>
      <p class="subtitle" id="subtitle"></p>
    </header>

    <div class="stats" id="stats" style="display:none;">
      <div class="stat-card">
        <div class="stat-label" style="color:#b91c1c;">Needs attention</div>
        <div class="stat-value" id="urgentCount"></div>
      </div>
      <div class="stat-card">
        <div class="stat-label" style="color:#15803d;">Fine for now</div>
        <div class="stat-value" id="fineCount"></div>
      </div>
    </div>

    <button id="checkBtn" onclick="runCheck()">Check Urgency</button>

    <div class="card-list" id="allList" style="margin-top:20px;"></div>

    <div id="summary-line" style="display:none; margin-bottom:12px; font-size:0.95rem; color:#64748b;">
      Checked <span id="product-count"></span> products · <span id="check-date"></span>
    </div>

    <div class="columns" id="columns" style="display:none;">
      <section>
        <div class="col-header">
          <span class="dot" style="background:#dc2626;"></span>
          <h2 class="col-title">Needs Attention Today</h2>
        </div>
        <div class="card-list" id="urgentList"></div>
      </section>

      <section>
        <div class="col-header">
          <span class="dot" style="background:#16a34a;"></span>
          <h2 class="col-title">Fine For Now</h2>
        </div>
        <div class="card-list" id="fineList"></div>
      </section>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script>
  const DAY = 86400000;

  let products = [];
  let referenceDate = null;
  let TODAY = null;

  const fmt = (d) => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function toNumber(value) {
    const num = Number(value);
    return Number.isFinite(num) ? num : 0;
  }

  function toDate(value) {
    if (typeof value !== 'string') return new Date(NaN);

    const [year, month, day] = value.split('-').map(Number);
    if (!year || !month || !day) return new Date(NaN);

    const date = new Date(year, month - 1, day);
    return Number.isNaN(date.getTime()) ? new Date(NaN) : date;
  }

  function renderAllList() {
    document.getElementById('allList').innerHTML = products.map((p) => `
      <div class="card pending-card">
        <div class="card-row">
          <span class="card-name">${esc(p.name)}</span>
          <span class="card-qty">${p.quantity} on hand</span>
        </div>
        <div class="card-meta">Expires ${esc(fmt(p.expirationDate))} · reorder at ${esc(p.threshold)}</div>
      </div>
    `).join('');
  }

  function getStatus(p) {
    const expirationDate = p.expirationDate instanceof Date && !Number.isNaN(p.expirationDate.getTime()) ? p.expirationDate : null;
    const daysToExp = expirationDate && TODAY ? Math.round((expirationDate - TODAY) / DAY) : null;
    const lowStock = Number.isFinite(p.quantity) && Number.isFinite(p.threshold) && p.quantity <= p.threshold;
    const isExpired = expirationDate ? daysToExp < 0 : false;
    const expiringSoon = expirationDate ? daysToExp >= 0 && daysToExp <= 14 : false;

    if (isExpired) return { status: 'expired', flags: ['Expired'] };
    if (lowStock || expiringSoon) return { status: 'urgent', flags: [
      ...(lowStock ? ['Low stock'] : []),
      ...(expiringSoon ? [daysToExp === 0 ? 'Expired' : `Expires in ${daysToExp}d`] : []),
    ] };
    return { status: 'fine', flags: [] };
  }

  function loadProducts() {
    Papa.parse('./data/dairy-data.csv', {
      download: true,
      header: true,
      dynamicTyping: true,
      complete: (results) => {
        const rows = results.data.filter((row) => row && row['Product Name']);

        referenceDate = rows.reduce((latest, row) => {
          const value = row['Date'];
          const parsed = toDate(value);
          if (Number.isNaN(parsed.getTime())) return latest;
          return latest && latest > parsed ? latest : parsed;
        }, null);
        TODAY = referenceDate;

        products = rows.map((row) => ({
          name: row['Product Name'],
          quantity: toNumber(row['Quantity in Stock (liters/kg)']),
          threshold: toNumber(row['Minimum Stock Threshold (liters/kg)']),
          expirationDate: toDate(row['Expiration Date']),
        }));

        console.log('Reference date:', TODAY ? fmt(TODAY) : 'Unknown');
        console.log('First 5 mapped products:', products.slice(0, 5));
        console.log('Sample dates:', products.slice(0, 5).map((p) => ({
          name: p.name,
          csvDate: p.expirationDate.toISOString().slice(0, 10),
          displayDate: fmt(p.expirationDate),
        })));
        renderAllList();
        checkUrgency();
      },
      error: (error) => {
        console.error('Failed to load dairy data', error);
        products = [];
        renderAllList();
        checkUrgency();
      },
    });
  }

  function checkUrgency() {
    const urgent = [], expired = [], fine = [];

    products.forEach((p) => {
      const statusInfo = getStatus(p);
      const row = {
        name: p.name,
        threshold: p.threshold,
        qtyLabel: `${p.quantity} on hand`,
        expLabel: p.expirationDate instanceof Date && !Number.isNaN(p.expirationDate.getTime()) ? fmt(p.expirationDate) : 'Unknown',
        flags: statusInfo.flags,
        status: statusInfo.status,
      };

      if (statusInfo.status === 'urgent') urgent.push(row);
      else if (statusInfo.status === 'expired') expired.push(row);
      else fine.push(row);
    });

    const urgentCount = urgent.length;
    const expiredCount = expired.length;
    const fineCount = fine.length;
    const totalRows = products.length;
    console.log('Reference-based counts:', { referenceDate: TODAY ? fmt(TODAY) : 'Unknown', totalRows, urgentCount, expiredCount, fineCount });

    const sampleRows = [...urgent.slice(0, 2), ...expired.slice(0, 2), ...fine.slice(0, 1)].map((item) => ({
      name: item.name,
      quantity: item.qtyLabel,
      threshold: item.threshold,
      expirationDate: item.expLabel,
      status: item.status,
      reason: item.flags.length > 0 ? item.flags.join(', ') : 'No issues',
    }));
    console.log('Sample urgency rows:', sampleRows);

    document.getElementById('subtitle').textContent =
      `Dairy stock — ${TODAY ? fmt(TODAY) : 'Unknown'}. Flagged if at/below reorder point or expiring within 14 days.`;
    document.getElementById('urgentCount').textContent = urgentCount;
    document.getElementById('fineCount').textContent = fineCount;

    document.getElementById('urgentList').innerHTML = urgent.map((p) => `
      <div class="card urgent-card">
        <div class="card-row">
          <span class="card-name">${esc(p.name)}</span>
          <span class="card-qty">${esc(p.qtyLabel)}</span>
        </div>
        <div class="chips">
          ${p.flags.map((f) => `<span class="chip">${esc(f)}</span>`).join('')}
        </div>
        <div class="card-meta">Expires ${esc(p.expLabel)} · reorder at ${esc(p.threshold)}</div>
      </div>
    `).join('');

    document.getElementById('fineList').innerHTML = [...expired, ...fine].map((p) => `
      <div class="card ${p.status === 'expired' ? 'expired-card' : 'fine-card'}">
        <div class="card-row">
          <span class="card-name">${esc(p.name)}</span>
          <span class="card-qty">${esc(p.qtyLabel)}</span>
        </div>
        <div class="chips">
          <span class="chip ${p.status === 'expired' ? 'chip-expired' : 'chip-ok'}">${p.status === 'expired' ? 'Expired' : 'All good'}</span>
        </div>
        <div class="card-meta">Expires ${esc(p.expLabel)} · reorder at ${esc(p.threshold)}</div>
      </div>
    `).join('');

    document.getElementById('product-count').textContent = products.length;
    document.getElementById('check-date').textContent = new Date().toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
    document.getElementById('summary-line').style.display = 'block';

    document.getElementById('stats').style.display = '';
    document.getElementById('columns').style.display = '';
    document.getElementById('checkBtn').style.display = 'none';
    document.getElementById('allList').style.display = 'none';
  }

  function runCheck() {
    checkUrgency();
  }

  loadProducts();
</script>
</body>
</html>
