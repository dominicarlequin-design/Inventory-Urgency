<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventory Urgency</title>
<meta name="description" content="A dairy stock triage tool — see what needs attention today, and what can wait.">
<meta property="og:title" content="Inventory Urgency">
<meta property="og:description" content="A dairy stock triage tool — see what needs attention today, and what can wait.">
<meta property="og:image" content="https://inventory-urgency.vercel.app/og-image.png">
<meta property="og:url" content="https://inventory-urgency.vercel.app/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Inventory Urgency">
<meta name="twitter:description" content="A dairy stock triage tool — see what needs attention today, and what can wait.">
<meta name="twitter:image" content="https://inventory-urgency.vercel.app/og-image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FAF7F2;
    --ink: #26392E;
    --ink-hover: #17241c;
    --ink-active: #0f1811;
    --sage: #7C9A82;
    --sage-light: #EAF0EA;
    --butter: #E3B23C;
    --clay: #A8402F;
    --clay-light: #F6E8E4;
    --stone: #6B6357;
    --hairline: #E2DACB;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'DM Sans', system-ui, sans-serif; color: var(--ink); background: var(--cream); }
  a { color: var(--ink); }
  a:hover { color: var(--ink-hover); }
  .page { min-height: 100vh; padding: 48px 32px; }
  .container { max-width: 1100px; margin: 0 auto; }
  .title { font-family: 'Instrument Serif', serif; font-style: italic; font-size: 34px; font-weight: 400; letter-spacing: -0.01em; margin: 0; }
  .subtitle { font-family: 'IBM Plex Mono', monospace; margin: 8px 0 0; font-size: 14px; color: var(--stone); }
  .stats { display: flex; gap: 0; margin: 28px 0 32px; flex-wrap: wrap; border-top: 1px solid var(--hairline); border-bottom: 1px solid var(--hairline); }
  .stat-card { flex: 1; min-width: 180px; padding: 18px 24px; }
  .stat-card + .stat-card { border-left: 1px solid var(--hairline); }
  .stat-label { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
  .stat-value { font-family: 'Instrument Serif', serif; font-style: italic; font-size: 36px; font-weight: 400; margin-top: 4px; }
  .toolbar { display: flex; gap: 12px; flex-wrap: wrap; margin: 0 0 12px; }
  .search-input { flex: 1; min-width: 200px; font-family: inherit; font-size: 14px; padding: 10px 14px; border: 1px solid var(--hairline); border-radius: 6px; background: #fff; color: var(--ink); }
  .search-input:focus { outline: 2px solid var(--ink); outline-offset: -1px; }
  .sort-select { font-family: inherit; font-size: 14px; padding: 10px 14px; border: 1px solid var(--hairline); border-radius: 6px; background: #fff; color: var(--ink); cursor: pointer; }
  .filter-chips { display: none; gap: 8px; flex-wrap: wrap; margin: 0 0 20px; }
  .filter-chip { font-family: inherit; font-size: 13px; font-weight: 600; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--hairline); background: #fff; color: var(--stone); cursor: pointer; transition: all 0.15s ease; }
  .filter-chip:hover { border-color: var(--stone); }
  .filter-chip.active { background: var(--ink); color: #fff; border-color: var(--ink); }
  .sticky-nav { display: none; position: sticky; top: 0; z-index: 10; gap: 20px; background: rgba(250, 247, 242, 0.92); backdrop-filter: blur(6px); border-bottom: 1px solid var(--hairline); padding: 12px 0; margin: 0 0 16px; }
  .nav-link { font-size: 14px; font-weight: 600; text-decoration: none; color: var(--stone); display: flex; align-items: center; gap: 6px; }
  .nav-link:hover { color: var(--ink); }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .card-list { display: flex; flex-direction: column; gap: 12px; }
  .card { background: #fff; border-radius: 6px; padding: 16px 18px; transition: box-shadow 0.15s ease, transform 0.15s ease; }
  .card:hover { box-shadow: 0 4px 12px rgba(38, 57, 46, 0.1); transform: translateY(-1px); }
  .card-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .card-name { font-weight: 600; font-size: 16px; }
  .card-qty { font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--stone); }
  .card-meta { font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--stone); margin-top: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chip { font-family: 'IBM Plex Mono', monospace; text-transform: uppercase; letter-spacing: 0.04em; font-size: 11px; font-weight: 600; background: var(--clay-light); color: var(--clay); border: 1px dashed var(--clay); border-radius: 3px; padding: 4px 10px; transform: rotate(-1.5deg); display: inline-block; }
  .chip-ok { background: var(--sage-light); color: var(--sage); border: 1px dashed var(--sage); transform: rotate(1deg); }
  .urgent-card { border: 1px solid var(--clay-light); border-left: 4px solid var(--clay); }
  .fine-card { border: 1px solid var(--sage-light); border-left: 4px solid var(--sage); }
  .list-footer { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 14px; }
  .list-count { font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--stone); margin: 0; }
  .show-more-btn { font-family: inherit; font-size: 14px; font-weight: 600; color: var(--ink); background: #fff; border: 1px solid var(--hairline); border-radius: 6px; padding: 10px 20px; cursor: pointer; transition: all 0.15s ease; }
  .show-more-btn:hover { background: var(--sage-light); border-color: var(--sage); }
  .empty-state { font-size: 14px; color: var(--stone); text-align: center; padding: 24px 0; margin: 0; }
  .back-to-top { display: none; position: fixed; bottom: 24px; right: 24px; font-family: inherit; font-size: 13px; font-weight: 600; color: #fff; background: var(--ink); border: none; border-radius: 999px; padding: 10px 16px; cursor: pointer; box-shadow: 0 4px 12px rgba(38, 57, 46, 0.2); transition: background 0.15s ease; z-index: 20; }
  .back-to-top:hover { background: var(--ink-hover); }
  #productSection { scroll-margin-top: 70px; }
  #checkBtn { font-family: 'Instrument Serif', serif; font-style: italic; font-size: 18px; font-weight: 400; color: #fff; background: var(--ink); border: none; border-radius: 6px; padding: 12px 22px; cursor: pointer; transition: background 0.15s ease; }
  #checkBtn:hover { background: var(--ink-hover); }
  #checkBtn:active { background: var(--ink-active); }
  @media (max-width: 700px) {
    .page { padding: 32px 20px; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="container">
    <header>
      <h1 class="title">Inventory Urgency</h1>
      <p class="subtitle" id="subtitle"></p>
    </header>

    <div class="stats" id="stats" style="display:none;">
      <div class="stat-card">
        <div class="stat-label" style="color:var(--clay);">Needs attention</div>
        <div class="stat-value" id="urgentCount"></div>
      </div>
      <div class="stat-card">
        <div class="stat-label" style="color:var(--sage);">Fine for now</div>
        <div class="stat-value" id="fineCount"></div>
      </div>
    </div>

    <div class="toolbar">
      <input type="text" id="searchInput" class="search-input" placeholder="Search products…">
      <select id="sortSelect" class="sort-select">
        <option value="default">Sort: Default</option>
        <option value="name">Sort: Name (A–Z)</option>
        <option value="expiry">Sort: Expiration date</option>
      </select>
    </div>

    <div class="filter-chips" id="filterChips">
      <button class="filter-chip active" data-reason="all" type="button">All</button>
      <button class="filter-chip" data-reason="low-stock" type="button">Low stock</button>
      <button class="filter-chip" data-reason="expiring" type="button">Expiring soon</button>
      <button class="filter-chip" data-reason="expired" type="button">Expired</button>
      <select id="locationFilter" class="sort-select">
        <option value="all">All Locations</option>
      </select>
    </div>

    <button id="checkBtn" onclick="runCheck()" style="display:none;">Check Urgency</button>

    <p class="empty-state" id="loadingState">Loading inventory data…</p>
    <p class="empty-state" id="errorState" style="display:none; color: var(--clay);"></p>

    <div class="card-list" id="allList" style="margin-top:20px;"></div>
    <div class="list-footer" id="allListFooter"></div>

    <div id="summary-line" style="display:none; margin-bottom:12px; font-size:0.95rem; color:#64748b;">
      Checked <span id="product-count"></span> products · <span id="check-date"></span>
    </div>

    <div class="sticky-nav" id="stickyNav">
      <a href="#productSection" class="nav-link"><span class="dot" style="background:var(--clay);"></span>Needs Attention <span id="navUrgentCount"></span></a>
      <a href="#productSection" class="nav-link"><span class="dot" style="background:var(--sage);"></span>Fine For Now <span id="navFineCount"></span></a>
    </div>

    <div id="columns" style="display:none;">
      <section id="productSection">
        <div class="card-list" id="checkedList"></div>
        <div class="list-footer" id="checkedListFooter"></div>
      </section>
    </div>
  </div>
</div>

<button class="back-to-top" id="backToTop" type="button">↑ Top</button>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script>
  const DAY = 86400000;
  const PAGE_SIZE = 50;

  let products = [];
  let urgentRows = [];
  let fineRows = [];
  let referenceDate = null;
  let TODAY = null;
  let checked = false;

  const state = {
    search: '',
    sort: 'default',
    reason: 'all',
    location: 'all',
    allPage: 1,
    listPage: 1,
  };

  const fmt = (d) => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function toNumber(value) {
    const num = Number(value);
    return Number.isFinite(num) ? num : 0;
  }

  function toDate(value) {
    if (typeof value !== 'string') return new Date(NaN);

    const [year, month, day] = value.split('-').map(Number);
    if (!year || !month || !day) return new Date(NaN);

    const date = new Date(year, month - 1, day);
    return Number.isNaN(date.getTime()) ? new Date(NaN) : date;
  }

  function matchesSearch(row) {
    if (!state.search) return true;
    return String(row.name).toLowerCase().includes(state.search);
  }

  function matchesLocation(row) {
    return state.location === 'all' || row.location === state.location;
  }

  function matchesReason(row) {
    if (state.reason === 'all') return true;
    if (!row.flags) return false;
    if (state.reason === 'low-stock') return row.flags.includes('Low stock');
    if (state.reason === 'expired') return row.flags.includes('Expired');
    if (state.reason === 'expiring') return row.flags.some((f) => f.startsWith('Expires in'));
    return true;
  }

  function expiryTime(row) {
    return row.expirationDate instanceof Date && !Number.isNaN(row.expirationDate.getTime())
      ? row.expirationDate.getTime()
      : Infinity;
  }

  function sortRows(rows) {
    const sorted = rows.slice();
    if (state.sort === 'name') sorted.sort((a, b) => String(a.name).localeCompare(String(b.name)));
    else if (state.sort === 'expiry') sorted.sort((a, b) => expiryTime(a) - expiryTime(b));
    return sorted;
  }

  function renderListFooter(id, shownCount, totalCount, onMore) {
    const el = document.getElementById(id);
    if (totalCount === 0) {
      el.innerHTML = `<p class="empty-state">No products match.</p>`;
      return;
    }
    const remaining = totalCount - shownCount;
    el.innerHTML = `
      <p class="list-count">Showing ${shownCount} of ${totalCount}</p>
      ${remaining > 0 ? `<button class="show-more-btn" type="button">Show ${Math.min(remaining, PAGE_SIZE)} more</button>` : ''}
    `;
    const btn = el.querySelector('.show-more-btn');
    if (btn) btn.addEventListener('click', onMore);
  }

  function renderNoDataState(listId, footerId) {
    document.getElementById(listId).innerHTML = `<p class="empty-state">No inventory data yet.</p>`;
    document.getElementById(footerId).innerHTML = '';
  }

  function renderAllList() {
    if (!products.length) return renderNoDataState('allList', 'allListFooter');
    const filtered = products.filter((r) => matchesSearch(r) && matchesLocation(r));
    const sorted = sortRows(filtered);
    const shown = sorted.slice(0, state.allPage * PAGE_SIZE);
    document.getElementById('allList').innerHTML = shown.map((p) => `
      <div class="card pending-card">
        <div class="card-row">
          <span class="card-name">${esc(p.name)} — ${esc(p.brand)}, ${esc(p.location)}</span>
          <span class="card-qty">${p.quantity} on hand</span>
        </div>
        <div class="card-meta">Expires ${esc(fmt(p.expirationDate))} · reorder at ${esc(p.threshold)}</div>
      </div>
    `).join('');
    renderListFooter('allListFooter', shown.length, sorted.length, () => { state.allPage++; renderAllList(); });
  }

  function getStatus(p) {
    const expirationDate = p.expirationDate instanceof Date && !Number.isNaN(p.expirationDate.getTime()) ? p.expirationDate : null;
    const recordDate = p.recordDate instanceof Date && !Number.isNaN(p.recordDate.getTime()) ? p.recordDate : null;
    const daysToExp = expirationDate && recordDate ? Math.round((expirationDate - recordDate) / DAY) : null;
    const lowStock = Number.isFinite(p.quantity) && Number.isFinite(p.threshold) && p.quantity <= p.threshold;
    const isExpired = daysToExp !== null ? daysToExp < 0 : false;
    const needsAttention = daysToExp !== null ? daysToExp <= 14 : false;

    if (lowStock || needsAttention) return { status: 'urgent', flags: [
      ...(lowStock ? ['Low stock'] : []),
      ...(needsAttention ? [isExpired ? 'Expired' : `Expires in ${daysToExp}d`] : []),
    ] };
    return { status: 'fine', flags: [] };
  }

  function loadProducts() {
    document.getElementById('loadingState').style.display = '';
    document.getElementById('errorState').style.display = 'none';

    Papa.parse('./data/dairy-data.csv', {
      download: true,
      header: true,
      dynamicTyping: true,
      complete: (results) => {
        document.getElementById('loadingState').style.display = 'none';

        const rows = results.data.filter((row) => row && row['Product Name']);

        referenceDate = rows.reduce((latest, row) => {
          const value = row['Date'];
          const parsed = toDate(value);
          if (Number.isNaN(parsed.getTime())) return latest;
          return latest && latest > parsed ? latest : parsed;
        }, null);
        TODAY = referenceDate;

        products = rows.map((row) => ({
          name: row['Product Name'],
          brand: row['Brand'],
          location: row['Location'],
          quantity: toNumber(row['Quantity in Stock (liters/kg)']),
          threshold: toNumber(row['Minimum Stock Threshold (liters/kg)']),
          expirationDate: toDate(row['Expiration Date']),
          recordDate: toDate(row['Date']),
        }));

        const locations = [...new Set(products.map((p) => p.location).filter(Boolean))].sort();
        document.getElementById('locationFilter').innerHTML =
          `<option value="all">All Locations</option>` +
          locations.map((loc) => `<option value="${esc(loc)}">${esc(loc)}</option>`).join('');

        console.log('Reference date:', TODAY ? fmt(TODAY) : 'Unknown');
        console.log('First 5 mapped products:', products.slice(0, 5));
        console.log('Sample dates:', products.slice(0, 5).map((p) => ({
          name: p.name,
          csvDate: p.expirationDate.toISOString().slice(0, 10),
          displayDate: fmt(p.expirationDate),
        })));
        document.getElementById('checkBtn').style.display = '';
        renderAllList();
        checkUrgency();
      },
      error: (error) => {
        console.error('Failed to load dairy data', error);
        document.getElementById('loadingState').style.display = 'none';
        const errorEl = document.getElementById('errorState');
        errorEl.textContent = 'Couldn\'t load inventory data. Please try refreshing the page.';
        errorEl.style.display = '';
      },
    });
  }

  function renderCheckedList() {
    if (!products.length) return renderNoDataState('checkedList', 'checkedListFooter');
    const combined = [...urgentRows, ...fineRows];
    const filtered = combined.filter((r) => matchesSearch(r) && matchesReason(r) && matchesLocation(r));
    const sorted = sortRows(filtered);
    const shown = sorted.slice(0, state.listPage * PAGE_SIZE);
    document.getElementById('checkedList').innerHTML = shown.map((p) => `
      <div class="card ${p.status === 'urgent' ? 'urgent-card' : 'fine-card'}">
        <div class="card-row">
          <span class="card-name">${esc(p.name)} — ${esc(p.brand)}, ${esc(p.location)}</span>
          <span class="card-qty">${esc(p.qtyLabel)}</span>
        </div>
        <div class="chips">
          ${p.status === 'urgent'
            ? p.flags.map((f) => `<span class="chip">${esc(f)}</span>`).join('')
            : `<span class="chip chip-ok">All good</span>`}
        </div>
        <div class="card-meta">Expires ${esc(p.expLabel)} · recorded ${esc(p.recordLabel)} · reorder at ${esc(p.threshold)}</div>
      </div>
    `).join('');
    renderListFooter('checkedListFooter', shown.length, sorted.length, () => { state.listPage++; renderCheckedList(); });
  }

  function renderCurrentView() {
    if (!checked) renderAllList();
    else renderCheckedList();
  }

  function checkUrgency() {
    urgentRows = [];
    fineRows = [];
    checked = true;

    products.forEach((p) => {
      const statusInfo = getStatus(p);
      const row = {
        name: p.name,
        brand: p.brand,
        location: p.location,
        threshold: p.threshold,
        qtyLabel: `${p.quantity} on hand`,
        expLabel: p.expirationDate instanceof Date && !Number.isNaN(p.expirationDate.getTime()) ? fmt(p.expirationDate) : 'Unknown',
        recordLabel: p.recordDate instanceof Date && !Number.isNaN(p.recordDate.getTime()) ? fmt(p.recordDate) : 'Unknown',
        expirationDate: p.expirationDate,
        flags: statusInfo.flags,
        status: statusInfo.status,
      };

      if (statusInfo.status === 'urgent') urgentRows.push(row);
      else fineRows.push(row);
    });

    const urgentCount = urgentRows.length;
    const fineCount = fineRows.length;
    const totalRows = products.length;
    console.log('Reference-based counts:', { referenceDate: TODAY ? fmt(TODAY) : 'Unknown', totalRows, urgentCount, fineCount });

    const sampleRows = [...urgentRows.slice(0, 2), ...fineRows.slice(0, 1)].map((item) => ({
      name: item.name,
      quantity: item.qtyLabel,
      threshold: item.threshold,
      expirationDate: item.expLabel,
      status: item.status,
      reason: item.flags.length > 0 ? item.flags.join(', ') : 'No issues',
    }));
    console.log('Sample urgency rows:', sampleRows);

    document.getElementById('subtitle').textContent =
      `Dairy stock — records through ${TODAY ? fmt(TODAY) : 'Unknown'}. Flagged if at/below reorder point, or expiring within 14 days of its own record date.`;
    document.getElementById('urgentCount').textContent = urgentCount;
    document.getElementById('fineCount').textContent = fineCount;
    document.getElementById('navUrgentCount').textContent = `(${urgentCount})`;
    document.getElementById('navFineCount').textContent = `(${fineCount})`;

    state.listPage = 1;
    renderCheckedList();

    document.getElementById('product-count').textContent = products.length;
    document.getElementById('check-date').textContent = new Date().toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
    document.getElementById('summary-line').style.display = 'block';

    document.getElementById('stats').style.display = '';
    document.getElementById('columns').style.display = '';
    document.getElementById('checkBtn').style.display = 'none';
    document.getElementById('allList').style.display = 'none';
    document.getElementById('allListFooter').style.display = 'none';
    document.getElementById('filterChips').style.display = 'flex';
    document.getElementById('stickyNav').style.display = 'flex';
  }

  function runCheck() {
    checkUrgency();
  }

  document.getElementById('searchInput').addEventListener('input', (e) => {
    state.search = e.target.value.trim().toLowerCase();
    state.allPage = 1;
    state.listPage = 1;
    renderCurrentView();
  });

  document.getElementById('sortSelect').addEventListener('change', (e) => {
    state.sort = e.target.value;
    state.allPage = 1;
    state.listPage = 1;
    renderCurrentView();
  });

  document.querySelectorAll('.filter-chip').forEach((btn) => {
    btn.addEventListener('click', () => {
      state.reason = btn.dataset.reason;
      state.listPage = 1;
      document.querySelectorAll('.filter-chip').forEach((b) => b.classList.toggle('active', b === btn));
      renderCheckedList();
    });
  });

  document.getElementById('locationFilter').addEventListener('change', (e) => {
    state.location = e.target.value;
    state.allPage = 1;
    state.listPage = 1;
    renderCurrentView();
  });

  const backToTop = document.getElementById('backToTop');
  window.addEventListener('scroll', () => {
    backToTop.style.display = window.scrollY > 400 ? 'block' : 'none';
  });
  backToTop.addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  loadProducts();
</script>
</body>
</html>
